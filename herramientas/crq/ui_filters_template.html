<!--
Plantilla HTML para 2 selects (categorías y tipo de torre).
Útil si deseas visualizar en un navegador, o usar la lista de valores en UI.
En Tkinter/CTk se construyen los mismos valores.
-->

<select id="selectCategorias">
  <option
    value="Cambio en Produccion.Manual.Estandar.Aprovisionamiento_pSeries.Riesgo =1"
  >
    Cambio en Produccion.Manual.Estandar.Aprovisionamiento_pSeries.Riesgo =1
  </option>
  <option value="Cambio en Produccion.Manual.Programado.General.Riesgo >=3">
    Cambio en Produccion.Manual.Programado.General.Riesgo >=3
  </option>
  <option value="Cambio en Produccion.Manual.Emergencia.General.Riesgo >=3">
    Cambio en Produccion.Manual.Emergencia.General.Riesgo >=3
  </option>
  <option value="Cambio en Produccion.Manual.Agil.General.Riesgo <=2">
    Cambio en Produccion.Manual.Agil.General.Riesgo <=2
  </option>
  <option
    value="Cambio en Produccion.Manual.Estandar.Aprovisionamiento_Eliminacion - Bases de Datos.Riesgo =1"
  >
    Cambio en Produccion.Manual.Estandar.Aprovisionamiento_Eliminacion - Bases
    de Datos.Riesgo =1
  </option>
  <option
    value="Cambio en Produccion.Manual.Estandar.Procesos Malla_Mantenimiento.Riesgo =1"
  >
    Cambio en Produccion.Manual.Estandar.Procesos Malla_Mantenimiento.Riesgo =1
  </option>
</select>

<select id="selectTorre">
  <option value="Base de datos">Base de datos</option>
  <option value="Pseries">Pseries</option>
  <option value="Malla de Opreaciones">Malla de Opreaciones</option>
  <option value="Wintel">Wintel</option>
</select>
